url_for_show:
  type: list
  list_type: simple
  default: "/t/*"
  description: "Enter paths that can trigger the Guest Gate. Add <code>*</code> to the end for prefix matching. Examples: <code>*</code>, <code>/</code>, <code>/latest</code>, <code>/t/*</code>, <code>/c/*</code>."

url_for_hide:
  type: list
  list_type: simple
  default: "/login*|/u/*|/session*|/invites/*|/about|/faq|/faq#*|/guidelines|/guidelines#*|/tos|/tos#*|/privacy|/privacy#*"
  description: "Enter paths where the Guest Gate must never display. Hide patterns always take precedence over the show list."

gate_trigger_mode:
  type: enum
  default: page_views
  choices:
    - page_views
    - time
    - scroll
    - lightbox
    - any
  description: "Choose what triggers the Guest Gate. When set to 'any', the gate is triggered by whichever configured trigger condition is met first."

page_view_threshold:
  type: integer
  default: 1
  min: 1
  description: "Number of eligible page views required before the gate can appear."

time_threshold_seconds:
  type: integer
  default: 30
  min: 1
  description: "Number of seconds spent on an eligible page before the gate can appear."

scroll_threshold_percent:
  type: integer
  default: 50
  min: 1
  max: 100
  description: "Percentage of an eligible page that must be scrolled before the gate can appear."

gate_show_delay_ms:
  type: integer
  default: 0
  min: 0
  description: "Delay the modal after a trigger fires, in milliseconds. 500-1000ms is a good starting point for a softer UX."

gate_repeat_mode:
  type: enum
  default: repeat_trigger
  choices:
    - repeat_trigger
    - random_page_views
    - once_per_session
  description: "Control what happens after the gate has already appeared. Random page views is only used with page-view based triggers."

repeat_page_view_threshold:
  type: integer
  default: 3
  min: 1
  description: "Maximum page views used by the random repeat mode. The next gate appears after a random number from 1 to this value."

gate_show_only_once:
  type: bool
  default: false
  description: "Legacy compatibility option. When enabled, show the Guest Gate at most once per browser session."

dismissable:
  type: bool
  default: true
  description: "Allow visitors to close the Guest Gate."

gate_modal_size:
  type: enum
  default: standard
  choices:
    - compact
    - standard
    - wide
  description: "Choose the overall width of the Guest Gate modal."

gate_body_alignment:
  type: enum
  default: center
  choices:
    - left
    - center
    - right
  description: "Horizontal alignment for the standard Guest Gate content and social login buttons."

gate_show_when_thumbnail_clicked:
  type: bool
  default: false
  description: "Legacy shortcut. Equivalent to using lightbox as the trigger mode."

use_gate_buttons:
  type: bool
  default: false
  description: "Use buttons in the modal footer instead of text links."

login_button_style:
  type: enum
  default: btn-primary
  choices:
    - btn-primary
    - btn-default
  description: "Guest Gate Login button style."

signup_button_style:
  type: enum
  default: btn-primary
  choices:
    - btn-primary
    - btn-default
  description: "Guest Gate Signup button style."

login_icon:
  type: string
  default: "user"
  description: "Font Awesome icon for the Log In button."

signup_icon:
  type: string
  default: "right-to-bracket"
  description: "Font Awesome icon for the Sign Up button."

svg_icons:
  type: list
  list_type: compact
  default: ""
  description: "List of Font Awesome icons used by this theme component."

custom_url_enabled:
  type: bool
  default: false
  description: "Use custom URLs for Login and Sign Up instead of Discourse's native actions."

custom_login_url:
  type: string
  default: "/login"
  description: "Login destination when custom URLs are enabled."

custom_signup_url:
  type: string
  default: "/signup"
  description: "Sign Up destination when custom URLs are enabled."

enable_discourse_connect_signup:
  type: bool
  default: false
  description: "Add a separate Sign Up button when Discourse Connect is enabled."

discourse_connect_signup_url:
  type: string
  default: ""
  description: "URL used by the Discourse Connect Sign Up button."

gate_title_visibility:
  type: enum
  default: block
  choices:
    - block
    - none
  description: "Visibility of the Guest Gate modal title."

gate_title_position:
  type: enum
  default: unset
  choices:
    - unset
    - auto
  description: "Modal title margin positioning."

gate_footer_position:
  type: enum
  default: center
  choices:
    - left
    - center
    - right
  description: "Horizontal alignment of the Guest Gate footer."

custom_gate_enabled:
  type: bool
  default: false
  description: "Enable the custom Guest Gate design."

custom_gate_image:
  type: upload
  default: ""
  description: "Image displayed above the custom Guest Gate text."

custom_gate_image_alt:
  type: string
  default: ""
  description: "Alternative text for the custom Guest Gate image."

custom_gate_image_width:
  type: string
  default: "150px"
  description: "Width of the custom Guest Gate image. Examples: <code>150px</code>, <code>50%</code>, <code>100%</code>."

custom_gate_image_position:
  type: enum
  default: center
  choices:
    - left
    - center
    - right
  description: "Alignment of the custom Guest Gate image."

custom_gate_big_text_position:
  type: enum
  default: center
  choices:
    - left
    - center
    - right
  description: "Alignment of the custom Guest Gate heading."

custom_gate_little_text_position:
  type: enum
  default: center
  choices:
    - left
    - center
    - right
  description: "Alignment of the custom Guest Gate text."

custom_gate_big_text_color:
  type: string
  default: "var(--primary)"
  description: "Color of the custom Guest Gate heading."

custom_gate_little_text_color:
  type: string
  default: "var(--primary)"
  description: "Color of the custom Guest Gate text."

custom_gate_background_color:
  type: string
  default: "var(--secondary)"
  description: "Background color of the custom Guest Gate modal."

custom_gate_footer_text_color:
  type: string
  default: "var(--primary-medium)"
  description: "Footer text color when custom gate styling is enabled."

custom_gate_link_color:
  type: string
  default: "var(--primary-medium)"
  description: "Footer link color when custom gate styling is enabled."

# --- Analytics -------------------------------------------------------------

enable_analytics:
  type: bool
  default: false
  description: "Track Guest Gate impressions (when it appears, on which page, and why) and clicks (Log In / Sign Up / dismiss) for analytics. Events are pushed to window.dataLayer (Google Tag Manager / GA4) and dispatched as a `discourse-guest-gate:analytics` browser event so you can also forward them to your own tool. No personal data is collected."

analytics_debug_logging:
  type: bool
  default: false
  description: "Also print every Guest Gate analytics event to the browser console. Useful while setting up a Google Tag Manager trigger; turn off in production."
